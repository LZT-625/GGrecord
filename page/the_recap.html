  <!--【年度回顧｜Navbar 導覽列】這段標籤是年度回顧頁最上方的網站導覽區域。-->

    <!--【年度回顧｜Navbar 內容】這段標籤控制 Logo、彈性空間與分頁連結的位置。-->

      <!--【年度回顧｜Navbar 左側 Logo】這段標籤提供回到首頁的 Logo 位置。-->

      <!--【年度回顧｜Navbar 中間彈性空間】這段標籤用來分隔 Logo 與右側導覽。-->

  <!--【年度回顧｜主要內容區】這段標籤是年度統計與歌曲演出機率的主內容範圍。-->
  <main class="page-main" id="the_recap">
    <!--【年度回顧｜內容容器】這段標籤控制頁面左右最大寬度與主要內容位置。-->
    <div class="section-shell page-shell">
      <!--【年度回顧｜頁面標題】這段標籤顯示年度回顧頁的大標題。-->
      <h1 class="page-title">年度回顧</h1>
      <!--【年度回顧｜頁面說明】這段標籤顯示年度資料與統計用途說明。-->
      <p class="section-description">年度演出資料與統計。年度歌曲演出機率也集中於本頁呈現。</p>

      <!--【年度回顧｜季度統計】這段標籤是年度四季演出數量的統計卡片區域。-->
      <div class="recap-grid">
        <!--【年度回顧｜季度統計卡】這段標籤代表單一季度的統計資料卡。-->
        <article class="recap-card"><span>第一季</span><strong>—</strong><small>場演出</small></article>
        <!--【年度回顧｜季度統計卡】這段標籤代表單一季度的統計資料卡。-->
        <article class="recap-card"><span>第二季</span><strong>—</strong><small>場演出</small></article>
        <!--【年度回顧｜季度統計卡】這段標籤代表單一季度的統計資料卡。-->
        <article class="recap-card"><span>第三季</span><strong>—</strong><small>場演出</small></article>
        <!--【年度回顧｜季度統計卡】這段標籤代表單一季度的統計資料卡。-->
        <article class="recap-card"><span>第四季</span><strong>—</strong><small>場演出</small></article>
      </div>

      <!--【年度回顧｜年度歌曲演出機率】這段標籤是歌曲演出比例與排行的主要區塊。-->
      <section class="recap-section" aria-labelledby="recap-ranking-title">
        <!--【年度回顧｜歌曲機率區塊標題】這段標籤顯示歌曲演出機率區塊名稱。-->
        <h2 id="recap-ranking-title" class="recap-section-title">年度歌曲演出機率</h2>
        <!--【年度回顧｜歌曲機率說明】這段標籤說明歌曲機率資料的計算用途。-->
        <p class="section-description">依目前已匯入的年度演出歌單資料計算歌曲出現比例，資料增加時會重新計算。</p>
        <!--【年度回顧｜歌曲機率列表】這段標籤是未來放置歌曲排行資料的容器。-->
        <div id="ranking-list" class="ranking-list"></div>
      </section>

  <!--【全站｜Footer 頁尾】這段標籤是網站最下方的共用頁尾區域。-->
